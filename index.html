<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 Mukofot olish</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK (Zone ID: 11990967) -->
  <script src="//libtl.com/sdk.js" data-zone="11990967" data-sdk="show_11990967"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .subtitle b { color: #2ea6ff; }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .btn-reward {
      background: linear-gradient(135deg, #ff9500, #ff6b00);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
    }

    .btn-reward:active { transform: scale(0.98); }

    .btn-reward:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-close {
      background: transparent;
      color: #888;
      font-size: 14px;
      padding: 10px;
    }

    .status {
      font-size: 14px;
      color: #666;
      margin: 8px 0 16px;
      min-height: 20px;
    }

    .status.success { color: #22c55e; }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎁</div>
    <h1>Mukofot olish</h1>
    <p class="subtitle">
      Reklama ko‘ring va <b>3 ta qo‘shimcha tarjima</b> oling
    </p>

    <button id="watchBtn" class="btn-reward" onclick="watchAdForReward()">
      🎬 Reklama ko‘rish
    </button>

    <p id="status" class="status"></p>

    <button class="btn-close" onclick="closeApp()">
      ⬅️ Botga qaytish
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    async function watchAdForReward() {
      const btn = document.getElementById('watchBtn');
      const status = document.getElementById('status');

      btn.disabled = true;
      btn.textContent = '⏳ Reklama yuklanmoqda...';
      status.textContent = '';
      status.className = 'status';

      try {
        await show_11990967();

        status.textContent = '✅ Rahmat! Mukofot botga yuborildi.';
        status.className = 'status success';
        btn.textContent = '🎉 Mukofot olindi';

        tg.sendData(JSON.stringify({
          action: 'reward',
          reward: 3,
          timestamp: Date.now()
        }));

        setTimeout(() => tg.close(), 2000);

      } catch (error) {
        console.error('Reklama xatosi:', error);
        status.textContent = '❌ Reklama yuklanmadi. Keyinroq urinib ko‘ring.';
        status.className = 'status error';
        btn.disabled = false;
        btn.textContent = '🎬 Qayta urinish';
      }
    }

    function closeApp() {
      tg.close();
    }
  </script>
</body>
</html>
