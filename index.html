<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RichAds Diagnostika</title>
    
    <!-- Telegram WebApp Rasmiy SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- RichAds Telegram Mini App Reklama Skripti -->
    <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
    <script>
      window.TelegramAdsController = new TelegramAdsController();
      window.TelegramAdsController.initialize({
        pubId: "1018576",
        appId: "null",
      });
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h3 {
            font-size: 18px;
            color: #2b5278;
            margin-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        pre {
            text-align: left;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            overflow-x: auto;
            max-height: 120px;
        }
        .btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>RichAds Diagnostika</h3>
        <p id="status">Skript holati tekshirilmoqda...</p>
        <pre id="debug-info">Yuklanmoqda...</pre>
        
        <button class="btn" onclick="testAd()">Reklamani Sinash</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        window.addEventListener('DOMContentLoaded', () => {
            let info = "";
            if (window.TelegramAdsController) {
                info += "TelegramAdsController mavjud.\n";
                try {
                    let proto = Object.getOwnPropertyNames(Object.getPrototypeOf(window.TelegramAdsController));
                    let keys = Object.keys(window.TelegramAdsController);
                    info += "Keys: " + JSON.stringify(keys) + "\n";
                    info += "Methods: " + JSON.stringify(proto) + "\n";
                } catch(e) {
                    info += "Xato: " + e.message + "\n";
                }
            } else {
                info += "TelegramAdsController TOPILMADI!\n";
            }
            document.getElementById("debug-info").innerText = info;
            document.getElementById("status").innerText = "Tayyor. Tugmani bosing.";
        });

        function testAd() {
            try {
                document.getElementById("status").innerText = "activate() chaqirildi...";
                if (window.TelegramAdsController) {
                    if (typeof window.TelegramAdsController.activate === 'function') {
                        window.TelegramAdsController.activate();
                    } else {
                        alert("activate() metodi topilmadi.");
                    }
                } else {
                    alert("Controller topilmadi.");
                }
            } catch (err) {
                alert("Xatolik: " + err.message);
                document.getElementById("status").innerText = "Xato yuz berdi.";
            }
        }
    </script>
</body>
</html>
