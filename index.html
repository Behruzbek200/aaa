<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RichAds Test Console</title>
    
    <!-- Telegram WebApp Rasmiy SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- RichAds Telegram Mini App Reklama Skripti -->
    <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
    <script>
      window.TelegramAdsController = new TelegramAdsController();
      window.TelegramAdsController.initialize({
        pubId: "1018576",
        appId: "null",
      });
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 10px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h3 {
            font-size: 18px;
            color: #2b5278;
            margin-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        #console {
            background: #111;
            color: #00ff00;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            text-align: left;
            height: 130px;
            overflow-y: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>RichAds Test Konsoli</h3>
        <p>Tugmani bosing va natijani quyida kuzating:</p>
        
        <button class="btn" id="adBtn">Reklamani Ishga Tushirish</button>
        
        <div id="console">Tizim tayyor...<br></div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function logToScreen(text) {
            const con = document.getElementById('console');
            con.innerHTML += text + "<br>";
            con.scrollTop = con.scrollHeight;
        }

        document.getElementById('adBtn').addEventListener('click', function() {
            logToScreen("--- Tugma bosildi ---");
            try {
                if (window.TelegramAdsController) {
                    logToScreen("Controller mavjud.");
                    if (typeof window.TelegramAdsController.triggerInterstitialBanner === 'function') {
                        logToScreen("triggerInterstitialBanner chaqirilmoqda...");
                        window.TelegramAdsController.triggerInterstitialBanner();
                        logToScreen("Funksiya bajarildi!");
                    } else {
                        logToScreen("Xato: Metod topilmadi.");
                    }
                } else {
                    logToScreen("Xato: Controller topilmadi.");
                }
            } catch (err) {
                logToScreen("Xatolik: " + err.message);
            }
        });
    </script>
</body>
</html>
