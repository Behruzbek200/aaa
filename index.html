<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RichAds Test</title>
    
    <!-- Telegram WebApp Rasmiy SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- RichAds Telegram Mini App Reklama Skripti -->
    <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
    <script>
      window.TelegramAdsController = new TelegramAdsController();
      window.TelegramAdsController.initialize({
        pubId: "1018576",
        appId: "null",
      });
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 20px;
            color: #2b5278;
        }
        .btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RichAds Reklama Sinovi</h1>
        <p>Reklamani chiqarish uchun pastdagi tugmani bosing:</p>
        
        <button class="btn" onclick="showAd()">Banner Reklamani Ko'rsatish</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function showAd() {
            if (window.TelegramAdsController) {
                try {
                    // Aniq mavjud bo'lgan metodni chaqiramiz
                    if (typeof window.TelegramAdsController.triggerInterstitialBanner === 'function') {
                        window.TelegramAdsController.triggerInterstitialBanner();
                    } else {
                        alert("triggerInterstitialBanner metodi topilmadi.");
                    }
                } catch (e) {
                    alert("Xatolik: " + e.message);
                }
            } else {
                alert("Controller yuklanmagan.");
            }
        }
    </script>
</body>
</html>
